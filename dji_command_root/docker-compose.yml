version: '3.8'

services:
  # ==========================================
  # 1. EMQX (MQTT Broker)
  # ==========================================
  emqx:
    image: emqx/emqx:5.8.1
    container_name: my_emqx
    restart: always
    ports:
      - "1883:1883"
      - "18083:18083"
      - "8083:8083"
    environment:
      - EMQX_ALLOW_ANONYMOUS=true
    volumes:
      - ./emqx_data:/opt/emqx/data
    networks:
      - dji_net
   # ==========================================
   # 1.5 MySQL 数据库服务 (新增)
   # ==========================================
  db:
     image: mysql:8.0
     container_name: dji_mysql
     restart: always
     ports:
       - "3306:3306"
     environment:
       MYSQL_ROOT_PASSWORD: root
       MYSQL_DATABASE: dji_database
     volumes:
       - ./mysql_data:/var/lib/mysql
     networks:
       - dji_net
     healthcheck:
       test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
       timeout: 20s
       retries: 10

  redis:
    image: redis:7-alpine
    container_name: my_redis
    restart: always
    # 不需要宿主机直连就别开端口（更安全）
    # ports:
    #   - "6379:6379"
    networks:
      - dji_net
  # ==========================================
  # 2. Django Web 服务 (API/Webhook)
  # ==========================================
  backend:
    image: dji-backend:v1
    container_name: my_django_backend
    restart: always
    command: gunicorn dji_command_root.wsgi:application --bind 0.0.0.0:8001 --workers 1 --threads 16 --timeout 120 --worker-class gthread
    ports:
      - "8001:8001"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    environment:
      #  [新增] MinIO 配置 (必须与下面 MinIO 服务一致)
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_EXTERNAL_ENDPOINT=http://192.168.10.10:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET_NAME=dji
      - ZLM_API_HOST=http://zlm:80
      - ZLM_SECRET=035c73f7-bb6b-4889-a715-d9eb2d1925cc 
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=dji_database
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - DETECT_HTTP_TIMEOUT=180
      
      #  [新增] 算法地址 (注意服务名是 drone-detection，端口是 8000)
      - FASTAPI_DETECT_URL=http://drone-detection:8000/detect
      
      # [新增] 数据库/MQTT配置 (如果需要)
      - DJI_BROKER_IP=emqx
    depends_on:
      - emqx
      - minio
      - drone-detection
      - zlm
      - db
      - redis
    networks:
      - dji_net

  # ==========================================
  # 3. [新增] Poller 扫描线程 (独立服务) ️
  # ==========================================
  poller:
    image: dji-backend:v1  # 复用后端镜像
    container_name: my_django_poller
    restart: always
    #  启动自定义命令
    command: python manage.py start_poller
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    environment:
      #  环境变量必须与 backend 保持完全一致
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET_NAME=dji
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=dji_database
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db
      - DB_PORT=3306
      - FASTAPI_DETECT_URL=http://drone-detection:8000/detect
      - REDIS_URL=redis://redis:6379/0
      - DETECT_HTTP_TIMEOUT=180
    depends_on:
      - backend
      - minio
      - drone-detection
      - db
      - redis
    networks:
      - dji_net

  # ==========================================
  # 4. Django MQTT 监听进程
  # ==========================================
  mqtt_worker:
    image: dji-backend:v1
    container_name: my_mqtt_listener
    restart: always
    command: python manage.py mqtt_listener
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    environment:
      - DJI_BROKER_IP=emqx
      - DJI_BROKER_PORT=1883
      - MQTT_BROKER_IP=emqx
      - MQTT_BROKER_PORT=1883
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=dji_database
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db
      - DB_PORT=3306 
     # 如果需要上传图片到 MinIO，这里也建议加上 MinIO 环境变量
    depends_on:
      - emqx
      - db
    networks:
      - dji_net


  # ==========================================
  # 4.5 Alarm stats scheduler (15 minutes)
  # ==========================================
  stats_scheduler:
    image: dji-backend:v1
    container_name: my_alarm_stats_scheduler
    restart: always
    command: sh -c "while true; do python manage.py refresh_alarm_dashboard_stats; sleep 900; done"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET_NAME=dji
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=dji_database
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db
    networks:
      - dji_net

  # ==========================================
  # 4.6 Alarm dashboard cache scheduler (15 minutes)
  # ==========================================
  dashboard_cache_scheduler:
    image: dji-backend:v1
    container_name: my_alarm_dashboard_cache_scheduler
    restart: always
    command: sh -c "python manage.py migrate --noinput && while true; do python manage.py refresh_alarm_dashboard_cache --days 30 90 365; sleep 900; done"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET_NAME=dji
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=dji_database
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db
    networks:
      - dji_net
      
  # ==========================================
  # 5. Nginx (前端 + 静态资源)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: my_nginx_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./media:/app/media
      - ./models:/app/models
    depends_on:
      - backend
      - zlm
    networks:
      - dji_net

  # ==========================================
  # 6. MinIO 对象存储服务
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      #  统一账号密码
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    volumes:
      - ./minio_data:/data
      - /home/admin123/deploy_package_1218/docker/minio/minio_config:/root/.minio
    command: server /data --console-address ":9001"
    networks:
      - dji_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==========================================
  # 7. GLM-4.1V 多模态大模型服务
  # ==========================================
  glm:
    image: glm:2.0
    container_name: glm
    restart: always
    ports:
      - "6006:6006"
    
    environment:
      - OMP_NUM_THREADS=6
      - MKL_NUM_THREADS=6
      - OPENBLAS_NUM_THREADS=6
      - NUMEXPR_NUM_THREADS=6
      - TOKENIZERS_PARALLELISM=false

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]  
    volumes:
      - /home/admin123/deploy_package_1218/docker/glm/models/GLM-4.1V-9B-Thinking-AWQ:/models/GLM-4.1V-9B-Thinking-AWQ
      - /home/admin123/deploy_package_1218/docker/glm/docker/start_glm_server.sh:/app/start_glm_server.sh
    networks:
      - dji_net
    command: ["./start_glm_server.sh"]
#    healthcheck:
#     test: ["CMD", "curl", "-f", "http://localhost:6006/v1/models"]
#    interval: 30s
#      timeout: 20s
#      retries: 5
#      start_period: 120s  

  # ==========================================
  # 8. 无人机检测算法服务
  # ==========================================
  drone-detection:
    image: drone-detection:4.0
    container_name: drone_detection_api
    restart: always
    ports:
      - "8000:8000"
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-admin123}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - GLM_BASE_URL=${GLM_BASE_URL:-http://glm:6006/v1}
      - GLM_API_KEY=${GLM_API_KEY:-my-secret-key}
      - GLM_MODEL_NAME=${GLM_MODEL_NAME:-glm-4.1v}
      - GLM_TIMEOUT=${GLM_TIMEOUT:-300}
      - RESPONSE_LOG_DIR=/app/response_logs
    volumes:
      - /home/admin123/deploy_package_1218/docker/detection/bridge_module:/app/bridge_module
      - /home/admin123/deploy_package_1218/docker/detection/contactline_module:/app/contactline_module
      - /home/admin123/deploy_package_1218/docker/detection/rail_module:/app/rail_module
      - /home/admin123/deploy_package_1218/docker/detection/GLM:/app/GLM
      - /home/admin123/deploy_package_1218/docker/detection/minioconfig.py:/app/minioconfig.py
      - /home/admin123/deploy_package_1218/docker/detection/main.py:/app/main.py
      - /home/admin123/deploy_package_1218/docker/detection/image_utils.py:/app/image_utils.py
      - /home/admin123/deploy_package_1218/docker/detection/protected_area:/app/protected_area
      - /home/admin123/deploy_package_1218/docker/detection/config_utils.py:/app/config_utils.py
      - /home/admin123/deploy_package_1218/docker/detection/weights:/app/weights
      - /home/admin123/deploy_package_1218/docker/detection/response_logs:/app/response_logs
    runtime: nvidia
    depends_on:
      - minio  
      - glm    
    networks:
      - dji_net
  # ==========================================
  # 8.5 GroundingDINO 保护区检测服务
  # ==========================================
  groundingdino:
    image: gdino:1.0
    container_name: groundingdino_service
    restart: always
    ports:
      - "8010:8010"
    volumes:
      - /home/admin123/deploy_package_1218/docker/GDINO/GroundingDINO/service:/opt/program/GroundingDINO/service
    runtime: nvidia
    networks:
      - dji_net

    # ==========================================
  # 9. ZLMediaKit 流媒体服务器 ⭐
  # ==========================================
  zlm:
    image: zlmediakit/zlmediakit:master
    container_name: zlmediakit_server
    restart: always
    command: /opt/media/bin/MediaServer -c /opt/media/conf/config.ini
    ports:
      # RTMP 推流端口（司空推流用）
      - "1935:1935"
      # HTTP-FLV 播放端口（前端播放用）
      - "8080:80"
      # RTSP 端口（可选）
      - "554:554"
      # API 管理端口
      - "8088:8080"
    environment:
      # 配置 API 密钥（用于截图等操作）
      - ZLM_API_SECRET=123456
    volumes:
      # 录制文件存储路径（可选）
      - ./zlm_data:/opt/media/www
      - ./zlm_conf/config.ini:/opt/media/conf/config.ini

    networks:
      - dji_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index/api/getServerConfig?secret=123456"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # 9.5 [新增] 每日维护服务 (清理数据/重置状态)
  # ==========================================
  maintenance:
    image: dji-backend:v1  # 复用后端镜像，无需重新构建
    container_name: my_maintenance_worker
    restart: always
    # 启动命令指向我们新写的脚本
    command: python manage.py start_maintenance
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    environment:
      # 数据库配置 (必须与 backend 保持一致)
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=dji_database
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db
    networks:
      - dji_net
networks:
  dji_net:
    driver: bridge
